<!doctype html><html lang="pt-BR"><head><script src="config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WG Admin</title>
<style>*{box-sizing:border-box}body{background:#050505;color:#eee;font-family:Arial,sans-serif;margin:0;padding:14px;max-width:900px;margin:auto}input,select,textarea,button{font:inherit;padding:10px;border-radius:6px;border:1px solid #333;background:#111;color:#fff;margin:3px 0;max-width:100%}input,textarea,select{width:100%}button{background:#e2b632;color:#000;font-weight:700;border:0;cursor:pointer;width:auto}button.s{background:#222;color:#eee;border:1px solid #444}button.r{background:#a33;color:#fff}.tabs button{background:#222;color:#eee}.tabs button.on{background:#e2b632;color:#000}.box{border:1px solid #222;padding:12px;margin:12px 0;border-radius:8px}h2,h3{color:#e2b632;margin:6px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-bottom:1px solid #222;padding:8px 0}.row>div{flex:1;min-width:180px}.badge{background:#e2b632;color:#000;border-radius:12px;padding:2px 9px;font-size:13px}img.th{width:64px;height:64px;object-fit:cover;border-radius:6px;background:#222}a{color:#e2b632}#cupom{display:none}
@media print{body>*:not(#cupom){display:none!important}#cupom{display:block;color:#000;background:#fff;font:12px monospace;padding:2mm}body.w58 #cupom{width:58mm}body.w80 #cupom{width:80mm}@page{margin:0}}</style></head><body>
<div id="app"></div><div id="cupom"></div>
<script>
const $=i=>document.getElementById(i),R=n=>'R$ '+Number(n).toFixed(2).replace('.',','),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tk=sessionStorage.atk,last=null,O=[],PP=[],tab='p',img='',ac=null;
const api=async(u,m='GET',b)=>{const r=await fetch((window.WG_API||'')+u,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(tk||'')},body:b&&JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(r.status==401&&tk&&u!='/api/admin/login'){out();throw Error('Sessão expirada')}if(!r.ok)throw Error(j.erro||'Erro '+r.status);return j};
function loginUI(){$('app').innerHTML='<form class="box" id="login-form" style="max-width:430px;margin:40px auto"><h2>Painel WG</h2><p style="color:#aaa">Entre com a senha do administrador.</p><label for="pw">Senha</label><input id="pw" name="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" autocapitalize="none" spellcheck="false" required><button type="button" class="s" id="show-password" aria-pressed="false">Mostrar senha</button><p id="login-error" role="alert" style="color:#ff9999"></p><button id="lb" type="submit">Entrar</button><p><a href="/">Voltar à loja</a></p></form>';$('login-form').onsubmit=e=>{e.preventDefault();login()};$('show-password').onclick=()=>{const show=$('pw').type==='password';$('pw').type=show?'text':'password';$('show-password').textContent=show?'Ocultar senha':'Mostrar senha';$('show-password').setAttribute('aria-pressed',String(show))}}
async function login(){const button=$('lb');button.disabled=true;button.textContent='Entrando…';$('login-error').textContent='';try{const password=$('pw').value.trim();if(!password)throw Error('Digite a senha do administrador.');const result=await api('/api/admin/login','POST',{password});tk=sessionStorage.atk=result.token;start()}catch(e){$('login-error').textContent=e.message;button.disabled=false;button.textContent='Entrar';$('pw').focus()}}
function out(){delete sessionStorage.atk;tk=null;clearInterval(window.iv);loginUI()}
function start(){$('app').innerHTML=`<div class="row"><h2>Painel WG <span class="badge" id="bell">0 novos</span></h2><div><button class="s" id="snd">🔔 Ativar som</button> <button class="s" id="lo">Sair</button></div></div>
<div class="tabs"><button id="tp">Produtos</button> <button id="to">Pedidos</button></div><div id="v"></div>`;
 $('lo').onclick=out;$('tp').onclick=()=>{tab='p';show()};$('to').onclick=()=>{tab='o';show()};$('snd').onclick=()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)();beep();$('snd').textContent='🔔 Som ativo'};
 document.body.className='w80';poll().then(show);window.iv=setInterval(poll,15000)}
function beep(){if(!ac)return;const o=ac.createOscillator();o.connect(ac.destination);o.frequency.value=880;o.start();o.stop(ac.currentTime+.4)}
async function show(){$('tp').className=tab=='p'?'on':'';$('to').className=tab=='o'?'on':'';if(tab=='p'){await lp();pform()}else orders()}
function pform(x={}){$('v').innerHTML=`<div class="box"><h3>${x.id?'Editar':'Novo'} produto</h3><input id="nm" placeholder="Nome" value="${E(x.name)}"><select id="ct">${['Roupas','Tênis','Acessórios'].map(c=>`<option ${c==x.category?'selected':''}>${c}</option>`).join('')}</select><input id="pr" type="number" step="0.01" min="0" placeholder="Preço (ex: 129.90)" value="${x.price||''}"><label>Foto: <input type="file" id="fl" accept="image/*"></label><img class="th" id="pv" src="${E(x.image||'')}" ${x.image?'':'hidden'}><textarea id="ds" placeholder="Descrição">${E(x.description)}</textarea>
<p>Estoque — uma linha por variação: <b>tamanho;cor;quantidade</b></p><textarea id="vr" rows="4" placeholder="M;Preto;5&#10;G;Preto;3">${E((x.variants||[]).map(v=>[v.size,v.color,v.stock].join(';')).join('\n'))}</textarea><button id="sv">Salvar produto</button> ${x.id?'<button class="s" id="cn">Cancelar</button>':''}</div><div class="box"><h3>Produtos cadastrados</h3>${PP.map(p=>`<div class="row"><img class="th" src="${E(p.image||'')}"><div><b>${E(p.name)}</b><br>${E(p.category)} · ${R(p.price)}<br><small data-stock="${p.id}">${p.variants.map(v=>E(v.size)+'/'+E(v.color)+': '+v.stock).join(' · ')||'sem estoque cadastrado'}</small></div><div><button class="s" data-e="${p.id}">Editar</button> <button class="r" data-d="${p.id}">Excluir</button></div></div>`).join('')||'<p>Nenhum produto ainda.</p>'}</div>`;
 img=x.image||'';window.eid=x.id||null;$('sv').onclick=saveP;if($('cn'))$('cn').onclick=()=>pform();$('fl').onchange=pick;
 document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{pform(PP.find(p=>p.id==b.dataset.e));scrollTo(0,0)});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>del(b.dataset.d))}
function pick(){const f=$('fl').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,700/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.75);$('pv').src=img;$('pv').hidden=false};i.src=r.result};r.readAsDataURL(f)}
async function lp(){PP=await api('/api/products')}
async function saveP(){if(!$('nm').value.trim()||!$('pr').value)return alert('Informe nome e preço');
 const variants=[];for(const l of $('vr').value.split('\n').filter(x=>x.trim())){const[a,b,c]=l.split(';');if(!a||!b||isNaN(+c))return alert('Linha inválida: "'+l+'". Use tamanho;cor;quantidade');variants.push({size:a.trim(),color:b.trim(),stock:+c})}
 try{await api('/api/admin/products','POST',{id:window.eid,name:$('nm').value.trim(),category:$('ct').value,price:$('pr').value,image:img,description:$('ds').value,variants});await lp();pform();alert('Produto salvo!')}catch(e){alert(e.message)}}
async function del(id){if(!confirm('Excluir este produto?'))return;try{await api('/api/admin/products/'+id,'DELETE');await lp();pform()}catch(e){alert(e.message)}}
async function poll(){try{O=await api('/api/admin/orders')}catch{return}const mx=O.length?O[0].id:0;if(last!==null&&mx>last){beep();document.title='🔔 Novo pedido!';alert('🔔 Novo pedido #'+mx)}last=mx;const n=O.filter(o=>o.status=='Novo').length;if($('bell'))$('bell').textContent=n+' novos';if(tab=='o'&&$('ol'))orders();if(tab=='p'){await lp();document.querySelectorAll('[data-stock]').forEach(el=>{const p=PP.find(p=>p.id==el.dataset.stock);if(p)el.textContent=p.variants.map(v=>v.size+'/'+v.color+': '+v.stock).join(' · ')||'sem estoque cadastrado'})}}
function orders(){$('v').innerHTML=`<div class="box"><label>Largura do cupom: <select id="wd"><option value="w80">80 mm</option><option value="w58">58 mm</option></select></label><div id="ol">${O.map(o=>{const c=o.customer||{};return `<div class="row"><div><b>#${o.id}</b> · ${new Date(o.created_at).toLocaleString('pt-BR')}<br>${E(c.name)} · ${E(c.phone)}<br><small>${c.delivery=='retirada'?'Retirada na loja':E(c.address)+' — CEP '+E(c.cep)}</small><br>${o.items.map(i=>i.qty+'x '+E(i.name)+' ('+E(i.size)+'/'+E(i.color)+')').join('<br>')}<br><b>${R(o.total)}</b> · ${E(o.payment)}</div><div><select data-s="${o.id}">${['Novo','Pago','Separando','Enviado','Entregue','Cancelado'].map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select><br><button data-p="${o.id}">🖨 Imprimir / Reimprimir</button> ${c.phone?`<a href="https://wa.me/55${String(c.phone).replace(/\D/g,'')}" target="_blank"><button class="s">WhatsApp</button></a>`:''}</div></div>`}).join('')||'<p>Nenhum pedido ainda.</p>'}</div></div>`;
 $('wd').value=document.body.className;$('wd').onchange=e=>document.body.className=e.target.value;
 document.querySelectorAll('[data-s]').forEach(s=>s.onchange=async()=>{try{await api('/api/admin/orders/'+s.dataset.s,'PATCH',{status:s.value});await poll()}catch(e){alert(e.message)}});document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>prt(b.dataset.p))}
function prt(id){const o=O.find(x=>x.id==id),c=o.customer||{};$('cupom').innerHTML=`<center><b>WG MULTIMARCAS</b><br>Pedido #${o.id}<br>${new Date(o.created_at).toLocaleString('pt-BR')}</center><hr>Cliente: ${E(c.name)}<br>Tel: ${E(c.phone)}<br>${c.delivery=='retirada'?'RETIRADA NA LOJA':E(c.address)+' - CEP '+E(c.cep)}<hr>${o.items.map(i=>`${i.qty}x ${E(i.name)}<br>&nbsp;${E(i.size)}/${E(i.color)} ${R(i.price*i.qty)}<br>`).join('')}<hr>Frete: ${R(o.shipping)}<br><b>TOTAL: ${R(o.total)}</b><br>Pagto: ${E(o.payment)}<br>Status: ${E(o.status)}<br><center>Obrigado!</center>`;setTimeout(()=>print(),100)}
tk?start():loginUI();
</script></body></html>
