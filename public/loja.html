<!doctype html><html lang="pt-BR"><head><script src="config.js"></script><script>window.addEventListener("error",function(e){var d=document.createElement("pre");d.style="position:fixed;z-index:999999;left:0;right:0;bottom:0;margin:0;background:#fff;color:#c00;font:12px monospace;padding:8px;white-space:pre-wrap";d.textContent="ERRO: "+e.message+" ("+(e.filename||"").split("/").pop()+":"+e.lineno+")";document.body&&document.body.appendChild(d)});</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WG Multimarcas — Loja</title>
<style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f5;font-family:Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;border-bottom:1px solid #2a2a2a;position:sticky;top:0;background:#050505;z-index:5}header b{color:#e2b632;letter-spacing:.1em}button,select,input,textarea{font:inherit;padding:9px;border-radius:6px;border:1px solid #333;background:#111;color:#fff}button{background:#e2b632;color:#000;font-weight:700;border:0;cursor:pointer}.bar{display:flex;gap:8px;flex-wrap:wrap;padding:16px 5vw}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:0 5vw 40px}.card{background:#111;border:1px solid #222;border-radius:10px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#222}.card div{padding:12px}.price{color:#e2b632;font-weight:700}#drawer{position:fixed;right:0;top:0;bottom:0;width:min(400px,100%);background:#0b0b0b;border-left:1px solid #333;padding:16px;overflow:auto;display:none;z-index:9}#drawer.on{display:block}#drawer input,#drawer select{width:100%;margin:4px 0}a{color:#e2b632}footer{padding:24px 5vw;border-top:1px solid #222;font-size:14px}.wa{position:fixed;left:16px;bottom:16px;background:#25d366;color:#000;padding:12px 16px;border-radius:30px;text-decoration:none;font-weight:700}</style></head><body>
<header><a href="index.html" style="text-decoration:none"><b>WG. MULTIMARCAS</b></a><span><button onclick="acct()" id="ub">Entrar</button> <button onclick="tg()">Carrinho (<span id="n">0</span>)</button></span></header>
<div class="bar"><input id="q" placeholder="Buscar produto" oninput="load()"><select id="cat" onchange="load()"><option value="">Todas categorias</option><option>Roupas</option><option>Tênis</option><option>Acessórios</option></select><select id="size" onchange="load()"><option value="">Tamanho</option></select><input id="color" placeholder="Cor" oninput="load()"></div>
<div class="grid" id="g"></div>
<div id="drawer"></div>
<footer><a href="pagina.html#contato">Contato</a> · <a href="pagina.html#trocas">Trocas e devoluções</a> · <a href="pagina.html#privacidade">Privacidade</a></footer>
<a class="wa" id="wa" target="_blank">WhatsApp</a>
<script>
let P=[],cart=JSON.parse(localStorage.cart||'[]'),tk=localStorage.tk,cfg={};const $=i=>document.getElementById(i),R=n=>'R$ '+Number(n).toFixed(2).replace('.',',');
const api=async(u,m='GET',b)=>{const r=await fetch((window.WG_API||'')+u,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(tk||'')},body:b&&JSON.stringify(b)});const j=await r.json();if(!r.ok)throw Error(j.erro||'Erro');return j};
const save=()=>{localStorage.cart=JSON.stringify(cart);$('n').textContent=cart.reduce((a,i)=>a+i.qty,0)};
async function load(){try{await load_()}catch(e){$('g').innerHTML='<p style="padding:0 5vw;color:#e2b632">⚠️ Não foi possível carregar os produtos ('+e.message+').<br>Esta página precisa estar publicada num servidor (Render). Abrir o arquivo direto do celular ou do zip não funciona. Se já está publicada, aguarde 1 minuto e recarregue.</p>'}}
async function load_(){const s=['q','cat','size','color'].map(k=>k+'='+encodeURIComponent($(k).value));P=await api('/api/products?'+s.join('&').replace('q=','q=').replace(/^q=/,'q='));
 const sizes=[...new Set(P.flatMap(p=>p.variants.map(v=>v.size)))];if($('size').options.length==1)sizes.forEach(z=>$('size').add(new Option(z)));
 $('g').innerHTML=P.map(p=>`<div class="card"><img src="${p.image||''}" alt=""><div><small>${p.category}</small><h4>${p.name}</h4><div class="price">${R(p.price)}</div><select id="v${p.id}">${p.variants.map(v=>`<option value="${v.id}" ${v.stock?'':'disabled'}>${v.size} / ${v.color}${v.stock?'':' (esgotado)'}</option>`).join('')}</select><button onclick="add(${p.id})" style="width:100%;margin-top:8px">Adicionar</button></div></div>`).join('')||'<p>Nenhum produto encontrado.</p>'}
function add(pid){const p=P.find(x=>x.id==pid),vid=+$('v'+pid).value,v=p.variants.find(x=>x.id==vid);if(!v)return;const c=cart.find(i=>i.vid==vid);c?c.qty++:cart.push({vid,name:p.name,label:v.size+' / '+v.color,price:+p.price,qty:1});save();tg(1)}
function tg(o){const d=$('drawer');d.classList.toggle('on',o||!d.classList.contains('on'));if(d.classList.contains('on'))draw()}
function draw(){const sub=cart.reduce((a,i)=>a+i.price*i.qty,0);$('drawer').innerHTML=`<button onclick="tg()">Fechar ✕</button><h3>Carrinho</h3>${cart.map((i,x)=>`<p>${i.name} (${i.label})<br>${i.qty}x ${R(i.price)} <button onclick="cart.splice(${x},1);save();draw()">remover</button></p>`).join('')||'<p>Vazio</p>'}<b>Subtotal: ${R(sub)}</b><hr>
<input id="ph" placeholder="Telefone"><input id="cep" placeholder="CEP" onblur="fr()"><input id="ad" placeholder="Endereço completo"><select id="dl" onchange="fr()"><option value="entrega">Entrega</option><option value="retirada">Retirar na loja</option></select><select id="pay"><option value="pix">Pix</option><option value="cartao">Cartão (na entrega/link)</option></select><p id="fr"></p><button onclick="buy()" style="width:100%">Finalizar pedido</button><hr><button onclick="mine()">Meus pedidos</button><div id="mo"></div>`}
async function fr(){const f=await api('/api/frete/'+$('cep').value);$('fr').textContent='Frete: '+($('dl').value=='retirada'?'Grátis':R(f.entrega))}
async function buy(){if(!tk)return acct();try{const o=await api('/api/orders','POST',{items:cart.map(i=>({variant_id:i.vid,qty:i.qty})),address:$('ad').value,cep:$('cep').value,delivery:$('dl').value,payment:$('pay').value,phone:$('ph').value});cart=[];save();$('drawer').innerHTML=`<h3>Pedido #${o.id} recebido!</h3><p>Total ${R(o.total)}</p>${$('pay')?'':''}<p>${cfg.pix?'Pague via Pix, chave: <b>'+cfg.pix+'</b>':'Combine o pagamento pelo WhatsApp.'}</p><button onclick="tg()">Fechar</button>`;load()}catch(e){alert(e.message)}}
async function mine(){const o=await api('/api/orders/mine');$('mo').innerHTML=o.map(x=>`<p>#${x.id} — ${R(x.total)} — <b>${x.status}</b></p>`).join('')||'Nenhum pedido'}
async function acct(){if(tk){if(confirm('Sair da conta?')){delete localStorage.tk;tk=null;$('ub').textContent='Entrar'}return}
 const name=prompt('Nome:');if(!name)return;const pw=prompt('Senha:');if(!pw)return;try{const r=await api('/api/login','POST',{name,password:pw});
 tk=localStorage.tk=r.token;$('ub').textContent='Olá, '+r.name}catch(x){alert(x.message)}}
api('/api/config').then(c=>{cfg=c;$('wa').href='https://wa.me/'+c.whatsapp+'?text=Olá, vim pela loja WG Multimarcas'});if(tk)$('ub').textContent='Minha conta';save();const u=new URLSearchParams(location.search).get('cat');if(u)$('cat').value=u;load();if(location.hash=='#carrinho')tg(1);if(location.hash=='#conta')setTimeout(acct,300);
</script></body></html>
